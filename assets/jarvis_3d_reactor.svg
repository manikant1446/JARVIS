<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#070f26" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="neon-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Radial Gradients for 3D Reactor Core -->
    <radialGradient id="reactor-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="plasma-cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .rotate-cw {
      transform-origin: 400px 250px;
      animation: rot-cw 40s linear infinite;
    }
    .rotate-ccw {
      transform-origin: 400px 250px;
      animation: rot-ccw 30s linear infinite;
    }
    .rotate-fast {
      transform-origin: 400px 250px;
      animation: rot-cw 15s linear infinite;
    }
    .pulse-glow {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .hud-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .flicker {
      animation: flick 4s infinite;
    }

    @keyframes rot-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rot-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes flick {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.4; }
      94% { opacity: 1; }
      96% { opacity: 0.6; }
      97% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#cyber-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />

    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Corner HUD Brackets -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 24 44 L 24 24 L 44 24" />
    <path d="M 776 44 L 776 24 L 756 24" />
    <path d="M 24 456 L 24 476 L 44 476" />
    <path d="M 776 456 L 776 476 L 756 476" />
  </g>

  <!-- Telemetry Left Panel -->
  <g class="hud-text" fill="#94a3b8" font-size="9" opacity="0.85">
    <text x="36" y="52" fill="#00f2fe" font-weight="700" font-size="11">SYSTEM: MARK LIII</text>
    <text x="36" y="70">KERNEL: DARWIN 24.1.0</text>
    <text x="36" y="86">AI BRAIN: GEMINI 2.0 LIVE</text>
    <text x="36" y="102">ROUTER: DETERMINISTIC &lt;2MS</text>
    <text x="36" y="118">SECURITY: 4-TIER ENFORCED</text>
    <text x="36" y="134">NATIVE TOOLS: 97 LOADED</text>
    <path d="M 36 144 L 180 144" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <text x="36" y="162" fill="#38bdf8">VOICE CORE: PCM 24kHz</text>
    <text x="36" y="178">VISION: MSS + QUARTZ</text>
    <text x="36" y="194">MEMORY: PERSISTENT SAFE</text>
    <text x="36" y="210">STATUS: NOMINAL 100%</text>
  </g>

  <!-- Telemetry Right Panel -->
  <g class="hud-text" fill="#94a3b8" font-size="9" text-anchor="end" opacity="0.85">
    <text x="764" y="52" fill="#34d399" font-weight="700" font-size="11">● ONLINE [FULL-DUPLEX]</text>
    <text x="764" y="70">HARDWARE: APPLE SILICON</text>
    <text x="764" y="86">POWER ADAPTER: CONNECTED</text>
    <text x="764" y="102">AUDIO DUPLEX: ACTIVE</text>
    <text x="764" y="118">SPOTIFY IPC: READY</text>
    <text x="764" y="134">BROWSER ENGINE: PLAYWRIGHT</text>
    <path d="M 620 144 L 764 144" stroke="#34d399" stroke-width="1" opacity="0.4" />
    <text x="764" y="162" fill="#fbbf24">KILLSWITCH: ARMED [PRIO 0]</text>
    <text x="764" y="178">CONFIRMATION TIMEOUT: 90s</text>
    <text x="764" y="194">VERIFICATION: RECURSIVE</text>
    <text x="764" y="210">ZERO-HALLUCINATION: ON</text>
  </g>

  <!-- Big Central 3D Arc Reactor -->
  <g id="arc-reactor-module">
    <!-- Plasma Glow Behind Core -->
    <circle cx="400" cy="250" r="190" fill="url(#plasma-cloud)" />

    <!-- Outermost Static Ring -->
    <circle cx="400" cy="250" r="180" fill="none" stroke="#0e3054" stroke-width="3" opacity="0.6" />
    <circle cx="400" cy="250" r="180" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="12 36" opacity="0.5" />

    <!-- Rotating Outer Cog Ring (CW) -->
    <g class="rotate-cw">
      <circle cx="400" cy="250" r="162" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.7" />
      <circle cx="400" cy="250" r="162" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="2 18" filter="url(#glow-cyan)" />
      <!-- Outer Node Markers -->
      <circle cx="562" cy="250" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
      <circle cx="238" cy="250" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
      <circle cx="400" cy="88" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
      <circle cx="400" cy="412" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
      <circle cx="515" cy="135" r="3" fill="#38bdf8" />
      <circle cx="285" cy="365" r="3" fill="#38bdf8" />
      <circle cx="285" cy="135" r="3" fill="#38bdf8" />
      <circle cx="515" cy="365" r="3" fill="#38bdf8" />
    </g>

    <!-- Rotating Middle Segment Ring (CCW) -->
    <g class="rotate-ccw">
      <circle cx="400" cy="250" r="140" fill="none" stroke="#0369a1" stroke-width="6" opacity="0.4" />
      <circle cx="400" cy="250" r="140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="35 25" filter="url(#glow-cyan)" />
      <circle cx="400" cy="250" r="126" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 8" opacity="0.8" />
    </g>

    <!-- 12 Arc Reactor Magnetic Vane Shrouds (Coils) -->
    <g id="reactor-coils" opacity="0.95">
      <!-- Generated 12 vanes in a circle -->
      <g transform="translate(400,250)">
        <!-- 0 deg -->
        <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
        <!-- 30 deg -->
        <g transform="rotate(30)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 60 deg -->
        <g transform="rotate(60)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 90 deg -->
        <g transform="rotate(90)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
        </g>
        <!-- 120 deg -->
        <g transform="rotate(120)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 150 deg -->
        <g transform="rotate(150)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 180 deg -->
        <g transform="rotate(180)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
        </g>
        <!-- 210 deg -->
        <g transform="rotate(210)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 240 deg -->
        <g transform="rotate(240)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 270 deg -->
        <g transform="rotate(270)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
        </g>
        <!-- 300 deg -->
        <g transform="rotate(300)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
        <!-- 330 deg -->
        <g transform="rotate(330)">
          <rect x="92" y="-12" width="28" height="24" rx="3" fill="#07203d" stroke="#38bdf8" stroke-width="1.5" />
          <line x1="96" y1="0" x2="116" y2="0" stroke="#00f2fe" stroke-width="2" />
        </g>
      </g>
    </g>

    <!-- Inner High Speed Ring -->
    <g class="rotate-fast">
      <circle cx="400" cy="250" r="82" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="14 12" opacity="0.9" />
      <polygon points="400,164 406,172 394,172" fill="#00f2fe" />
      <polygon points="400,336 406,328 394,328" fill="#00f2fe" />
      <polygon points="314,250 322,256 322,244" fill="#00f2fe" />
      <polygon points="486,250 478,256 478,244" fill="#00f2fe" />
    </g>

    <!-- 3D Gyro Ellipse Ring -->
    <g transform="translate(400, 250) rotate(-28)">
      <ellipse cx="0" cy="0" rx="90" ry="36" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.75" />
      <ellipse cx="0" cy="0" rx="90" ry="36" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 40" filter="url(#glow-cyan)" />
    </g>

    <!-- Glowing Core Center (Pulsing) -->
    <g class="pulse-glow" transform-origin="400px 250px">
      <!-- Outer Core Glow -->
      <circle cx="400" cy="250" r="56" fill="url(#reactor-core)" filter="url(#glow-core)" />
      <!-- Middle Core Disk -->
      <circle cx="400" cy="250" r="42" fill="#0369a1" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
      <!-- Super Bright Inner Nucleus -->
      <circle cx="400" cy="250" r="28" fill="#ffffff" filter="url(#glow-cyan)" />
      <circle cx="400" cy="250" r="14" fill="#ffffff" />
    </g>

    <!-- Center Reticle Over Core -->
    <g stroke="#0284c7" stroke-width="1.5" opacity="0.8">
      <line x1="400" y1="216" x2="400" y2="232" />
      <line x1="400" y1="268" x2="400" y2="284" />
      <line x1="366" y1="250" x2="382" y2="250" />
      <line x1="418" y1="250" x2="434" y2="250" />
      <circle cx="400" cy="250" r="18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>
  </g>

  <!-- Bottom Title & Status Bar -->
  <g class="hud-text" text-anchor="middle">
    <!-- Glowing Banner Line -->
    <line x1="160" y1="440" x2="640" y2="440" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <circle cx="160" cy="440" r="3" fill="#00f2fe" />
    <circle cx="640" cy="440" r="3" fill="#00f2fe" />

    <!-- Subtitles -->
    <text x="400" y="458" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="4">
      JARVIS MARK LIII • AUTONOMOUS DESKTOP INTELLIGENCE
    </text>
    <text x="400" y="476" fill="#64748b" font-size="9" letter-spacing="2">
      FULL-DUPLEX GEMINI LIVE 2.0 • 19 NATIVE OPERATING ENGINES • 4-TIER SECURITY GATE
    </text>
  </g>
</svg>
