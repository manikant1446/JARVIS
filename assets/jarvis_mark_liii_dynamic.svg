<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#070f26" />
      <stop offset="80%" stop-color="#0b1739" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="hud-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="metric-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111c38" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="reactor-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-hud {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", monospace;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .font-mono {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
    }

    /* Keyframe Animations */
    .spin-cw {
      transform-origin: 140px 185px;
      animation: spinCw 30s linear infinite;
    }
    .spin-ccw {
      transform-origin: 140px 185px;
      animation: spinCcw 20s linear infinite;
    }
    .core-pulse {
      animation: pulseCore 3s ease-in-out infinite alternate;
      transform-origin: 140px 185px;
    }
    .wave-bar {
      animation: waveMove 1.4s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    .laser-bus {
      stroke-dasharray: 6 16;
      animation: laserFlow 8s linear infinite;
    }
    .status-blink {
      animation: blink 2s infinite;
    }

    @keyframes spinCw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCcw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes pulseCore {
      0% { transform: scale(0.95); opacity: 0.85; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes laserFlow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -200; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes waveMove {
      0% { height: 4px; y: 338px; }
      100% { height: 22px; y: 320px; }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1000" height="440" rx="16" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="120" y1="0" x2="120" y2="440" />
    <line x1="260" y1="0" x2="260" y2="440" />
    <line x1="400" y1="0" x2="400" y2="440" />
    <line x1="600" y1="0" x2="600" y2="440" />
    <line x1="780" y1="0" x2="780" y2="440" />
  </g>

  <!-- Technical Corner Brackets (Positioned cleanly at outer canvas perimeter) -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 16 36 L 16 16 L 36 16" />
    <path d="M 984 36 L 984 16 L 964 16" />
    <path d="M 16 404 L 16 424 L 36 424" />
    <path d="M 984 404 L 984 424 L 964 424" />
  </g>

  <!-- ============================================== -->
  <!-- TOP STATUS HEADER (Inwardly offset with 16px bracket clearance) -->
  <!-- ============================================== -->
  <!-- Top Left Pill: System Core Status -->
  <g transform="translate(52, 20)">
    <rect x="0" y="0" width="244" height="26" rx="13" fill="url(#hud-pill)" stroke="#00f2fe" stroke-width="1" />
    <circle cx="15" cy="13" r="4.5" fill="#34d399" class="status-blink" />
    <text x="28" y="17" fill="#38bdf8" font-size="8.8" class="font-hud" font-weight="700" letter-spacing="0.5px">
      CORE 8.4 // ONLINE (<tspan fill="#34d399">100% NOMINAL</tspan>)
    </text>
  </g>

  <!-- Top Right Pill: OS & Architecture -->
  <g transform="translate(704, 20)">
    <rect x="0" y="0" width="244" height="26" rx="13" fill="url(#hud-pill)" stroke="#00f2fe" stroke-width="1" opacity="0.85" />
    <text x="122" y="17" fill="#94a3b8" font-size="8.8" class="font-hud" text-anchor="middle" letter-spacing="0.5px">
      DARWIN 24.1.0 • macOS SILICON/INTEL
    </text>
  </g>

  <!-- ============================================== -->
  <!-- COLUMN 1: 3D ARC REACTOR & SENSOR (x=24 to 255) -->
  <!-- ============================================== -->
  <g id="col-1-arc-reactor">
    <!-- Ambient Halo -->
    <circle cx="140" cy="185" r="92" fill="url(#reactor-glow)" />

    <!-- Static Outer Calibration Ring -->
    <circle cx="140" cy="185" r="84" fill="none" stroke="#0e3054" stroke-width="2" />
    <circle cx="140" cy="185" r="84" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 18" opacity="0.6" />

    <!-- Outer Rotating Cog Ring (CW) -->
    <g class="spin-cw">
      <circle cx="140" cy="185" r="72" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="140" cy="185" r="72" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="3 14" filter="url(#glow-cyan)" />
      <!-- Radial Node Markers -->
      <circle cx="212" cy="185" r="2.5" fill="#00f2fe" />
      <circle cx="68" cy="185" r="2.5" fill="#00f2fe" />
      <circle cx="140" cy="113" r="2.5" fill="#00f2fe" />
      <circle cx="140" cy="257" r="2.5" fill="#00f2fe" />
    </g>

    <!-- Inner Counter-Rotating Ring (CCW) -->
    <g class="spin-ccw">
      <circle cx="140" cy="185" r="56" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="20 14" filter="url(#glow-cyan)" />
      <circle cx="140" cy="185" r="46" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" opacity="0.8" />
    </g>

    <!-- 8 Magnetic Flux Vanes -->
    <g transform="translate(140, 185)" opacity="0.95">
      <rect x="36" y="-5" width="14" height="10" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
      <rect x="-50" y="-5" width="14" height="10" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
      <rect x="-5" y="36" width="10" height="14" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
      <rect x="-5" y="-50" width="10" height="14" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
      <g transform="rotate(45)">
        <rect x="36" y="-5" width="14" height="10" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
        <rect x="-50" y="-5" width="14" height="10" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
        <rect x="-5" y="36" width="10" height="14" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
        <rect x="-5" y="-50" width="10" height="14" rx="2" fill="#07203d" stroke="#38bdf8" stroke-width="1" />
      </g>
    </g>

    <!-- 3D Gyro Ellipse Ring -->
    <g transform="translate(140, 185) rotate(-28)">
      <ellipse cx="0" cy="0" rx="40" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75" />
    </g>

    <!-- Glowing Core Center -->
    <g class="core-pulse">
      <circle cx="140" cy="185" r="24" fill="#0369a1" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="140" cy="185" r="15" fill="#ffffff" filter="url(#glow-core)" />
      <circle cx="140" cy="185" r="7" fill="#ffffff" />
    </g>

    <!-- Audio Waveform Visualizer -->
    <g transform="translate(60, 288)">
      <text x="80" y="16" fill="#64748b" font-size="8.5" class="font-hud" text-anchor="middle" letter-spacing="1px">
        24kHz DUPLEX PCM STREAM
      </text>
      <!-- 13 Animated Bars -->
      <rect x="16" y="332" width="4" height="12" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.1s" />
      <rect x="26" y="336" width="4" height="8" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.4s" />
      <rect x="36" y="328" width="4" height="16" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.2s" />
      <rect x="46" y="334" width="4" height="10" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.6s" />
      <rect x="56" y="324" width="4" height="20" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.3s" filter="url(#glow-cyan)" />
      <rect x="66" y="328" width="4" height="16" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.5s" />
      <rect x="76" y="322" width="4" height="22" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.15s" filter="url(#glow-cyan)" />
      <rect x="86" y="330" width="4" height="14" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.7s" />
      <rect x="96" y="326" width="4" height="18" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.25s" />
      <rect x="106" y="334" width="4" height="10" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.45s" />
      <rect x="116" y="328" width="4" height="16" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.35s" />
      <rect x="126" y="336" width="4" height="8" rx="2" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.55s" />
      <rect x="136" y="332" width="4" height="12" rx="2" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.2s" />
    </g>

    <!-- Laser Conduit to Center Body -->
    <line x1="230" y1="185" x2="265" y2="185" stroke="#00f2fe" stroke-width="2" class="laser-bus" filter="url(#glow-cyan)" />
    <circle cx="265" cy="185" r="3" fill="#00f2fe" />
  </g>

  <!-- ============================================== -->
  <!-- COLUMN 2: BRANDING & SYSTEM INFO (x=275 to 585) -->
  <!-- Width = 310px. Perfectly measured to avoid overlap -->
  <!-- ============================================== -->
  <g transform="translate(275, 68)">
    <!-- Small Category Badge -->
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#0b132b" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="15" fill="#38bdf8" font-size="9" class="font-hud" font-weight="700" text-anchor="middle" letter-spacing="1px">
      ⚡ AUTONOMOUS DESKTOP OS ⚡
    </text>

    <!-- Main Title (fits within 310px) -->
    <text x="0" y="58" fill="url(#title-grad)" font-size="29" class="font-title">
      JARVIS MARK LIII
    </text>

    <!-- Subtitle -->
    <text x="0" y="82" fill="#94a3b8" font-size="10.5" class="font-hud" font-weight="600" letter-spacing="0.5px">
      GEMINI LIVE 2.0 • 19 NATIVE ENGINES
    </text>

    <!-- Glowing Accent Divider -->
    <line x1="0" y1="94" x2="290" y2="94" stroke="#00f2fe" stroke-width="1" opacity="0.4" />

    <!-- Clean Value Statement Lines -->
    <g fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" opacity="0.92">
      <text x="0" y="118">Zero cloud latency for local desktop tasks.</text>
      <text x="0" y="138">Deterministic fast router intercepts queries</text>
      <text x="0" y="158">in under <tspan fill="#facc15" font-weight="bold">1.8ms</tspan> with a <tspan fill="#f43f5e" font-weight="bold">4-tier security gate</tspan>.</text>
    </g>

    <!-- Tag Pills Row 1 -->
    <g transform="translate(0, 178)" font-size="9" class="font-mono">
      <rect x="0" y="0" width="88" height="22" rx="4" fill="#07203d" stroke="#00f2fe" stroke-width="0.8" />
      <text x="44" y="15" fill="#00f2fe" text-anchor="middle">&lt;1.8ms FAST</text>

      <rect x="96" y="0" width="102" height="22" rx="4" fill="#1f0b2b" stroke="#c084fc" stroke-width="0.8" />
      <text x="147" y="15" fill="#c084fc" text-anchor="middle">GEMINI LIVE</text>

      <rect x="206" y="0" width="88" height="22" rx="4" fill="#2b0b13" stroke="#f43f5e" stroke-width="0.8" />
      <text x="250" y="15" fill="#f43f5e" text-anchor="middle">4-TIER GATE</text>
    </g>

    <!-- Tag Pills Row 2 -->
    <g transform="translate(0, 208)" font-size="9" class="font-mono">
      <rect x="0" y="0" width="128" height="22" rx="4" fill="#0b2b1a" stroke="#34d399" stroke-width="0.8" />
      <text x="64" y="15" fill="#34d399" text-anchor="middle">97 NATIVE TOOLS</text>

      <rect x="136" y="0" width="158" height="22" rx="4" fill="#1c2541" stroke="#38bdf8" stroke-width="0.8" />
      <text x="215" y="15" fill="#38bdf8" text-anchor="middle">ZERO-TRUST VERIFIER</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- COLUMN 3: 4 FLOATING METRIC HUD TILES (x=600 to 975) -->
  <!-- Width = 375px. Cards are 370px wide with ample space -->
  <!-- ============================================== -->
  <g transform="translate(605, 65)">
    <!-- Tile 1: Fast Router -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="365" height="62" rx="8" fill="url(#metric-card-bg)" stroke="#38bdf8" stroke-width="1" />
      <circle cx="24" cy="31" r="12" fill="#07203d" stroke="#facc15" stroke-width="1.5" />
      <text x="24" y="36" fill="#facc15" font-size="12" text-anchor="middle" font-weight="bold">⚡</text>
      <text x="46" y="26" fill="#ffffff" font-size="11.5" class="font-hud" font-weight="700">&lt;1.8ms FAST ROUTER</text>
      <text x="46" y="44" fill="#94a3b8" font-size="9.5" class="font-hud">Zero-latency deterministic local regex bypass</text>
    </g>

    <!-- Tile 2: 97 Discovered Tools -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="365" height="62" rx="8" fill="url(#metric-card-bg)" stroke="#34d399" stroke-width="1" />
      <circle cx="24" cy="31" r="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="24" y="35" fill="#34d399" font-size="11" text-anchor="middle">🛠️</text>
      <text x="46" y="26" fill="#ffffff" font-size="11.5" class="font-hud" font-weight="700">97 NATIVE OS TOOLS</text>
      <text x="46" y="44" fill="#94a3b8" font-size="9.5" class="font-hud">Hardware, music, files, browser, cybersec</text>
    </g>

    <!-- Tile 3: 4-Tier Security Gate -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="365" height="62" rx="8" fill="url(#metric-card-bg)" stroke="#f43f5e" stroke-width="1" />
      <circle cx="24" cy="31" r="12" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
      <text x="24" y="35" fill="#f43f5e" font-size="11" text-anchor="middle">🛡️</text>
      <text x="46" y="26" fill="#ffffff" font-size="11.5" class="font-hud" font-weight="700">4-TIER SECURITY GATE</text>
      <text x="46" y="44" fill="#94a3b8" font-size="9.5" class="font-hud">Voice confirmation for external comms &amp; deletes</text>
    </g>

    <!-- Tile 4: Priority 0 Killswitch -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="365" height="62" rx="8" fill="url(#metric-card-bg)" stroke="#fbbf24" stroke-width="1" />
      <circle cx="24" cy="31" r="12" fill="#451a03" stroke="#fbbf24" stroke-width="1.5" />
      <text x="24" y="35" fill="#fbbf24" font-size="11" text-anchor="middle">🛑</text>
      <text x="46" y="26" fill="#ffffff" font-size="11.5" class="font-hud" font-weight="700">PRIORITY 0 KILLSWITCH</text>
      <text x="46" y="44" fill="#94a3b8" font-size="9.5" class="font-hud">Instant &lt;1ms hardware thread interrupt ("Mark stop")</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- BOTTOM TELEMETRY FOOTER BAR (52px inset for corner bracket clearance) -->
  <!-- ============================================== -->
  <g transform="translate(52, 385)">
    <!-- Dividing line -->
    <line x1="0" y1="0" x2="896" y2="0" stroke="#00f2fe" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="2.5" fill="#00f2fe" />
    <circle cx="896" cy="0" r="2.5" fill="#00f2fe" />

    <!-- Zone 1: Left (x=0 to 320) -->
    <text x="6" y="22" fill="#64748b" font-size="9" class="font-hud" letter-spacing="0.5px">
      SENSORS: 24kHz DUPLEX PCM • MSS RETINA • OPTICAL WEBCAM
    </text>

    <!-- Zone 2: Center (centered at x=448, spans 340 to 556) -->
    <text x="448" y="22" fill="#38bdf8" font-size="9" class="font-hud" text-anchor="middle" letter-spacing="0.5px">
      STATE VERIFIER: ZERO-TRUST KERNEL AUDIT
    </text>

    <!-- Zone 3: Right (aligned at x=890, spans 710 to 890) -->
    <text x="890" y="22" fill="#34d399" font-size="9" class="font-hud" text-anchor="end" letter-spacing="0.5px">
      TRILINGUAL: EN • हिन्दी • HINGLISH
    </text>
  </g>
</svg>
